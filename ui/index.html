<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕️</text></svg>" />
    <title>CarlNotes</title>
    <script>
      // resolve the theme before first-paint so the page doesn't flash the wrong theme.
      // an explicit choice saved in localStorage wins, otherwise falls back to the OS setting
      (() => {
        try {
          const saved = localStorage.getItem("theme")
          const isDark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
          document.documentElement.classList.toggle("dark", isDark)
        } catch {}
      })()
    </script>
    <script type="module" src="src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
