<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#3b2a1d" />

    <script>
      // resolve the theme before first-paint so the page doesn't flash the wrong theme.
      // an explicit choice saved in localStorage wins, otherwise fall back to the OS setting
      (() => {
        try {
          const saved = localStorage.getItem("theme")
          const isDark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
          document.documentElement.classList.toggle("dark", isDark)
          // the chrome tint follows the resolved theme's hero, since the theme is a class and not the OS setting
          if (isDark) {
            document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#0f0c09")
          }
        } catch {}
      })()
    </script>

    <title>CarlNotes — He already read it. All of it.</title>
    <meta name="description" content="Carl keeps up with your topics and turns what matters into notes worth reading." />
    <link rel="canonical" href="https://carlnotes.com" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CarlNotes" />
    <meta property="og:url" content="https://carlnotes.com" />
    <meta property="og:title" content="CarlNotes — He already read it. All of it." />
    <meta property="og:description" content="Carl keeps up with your topics and turns what matters into notes worth reading." />
    <meta property="og:image" content="https://carlnotes.com/opengraph-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CarlNotes — He already read it. All of it." />

    <meta name="twitter:title" content="CarlNotes — He already read it. All of it." />
    <meta name="twitter:description" content="Carl keeps up with your topics and turns what matters into notes worth reading." />
    <meta name="twitter:image" content="https://carlnotes.com/opengraph-image.png" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <script type="module" src="src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:42rem;margin:0 auto;padding:3rem 1.5rem;font-family:system-ui,sans-serif;line-height:1.6">
        <h1>CarlNotes</h1>
        <p>CarlNotes keeps up with the topics you choose and turns what matters into notes worth reading.</p>
        <h2>What CarlNotes does</h2>
        <ul>
          <li>You create a topic and describe in plain language what you want followed.</li>
          <li>CarlNotes searches the web, YouTube, and podcasts for new material on that topic on a daily or weekly schedule.</li>
          <li>Each finding is scored against your description, so you get what's relevant instead of everything published.</li>
          <li>Findings arrive as a ranked top results list with a summarized note, in the app and by email.</li>
        </ul>
        <p>You can sign in with Google, with GitHub, or with an email address and password.
          Sign in with Google requests only your name, email address, and profile picture,
          and does not read or write any other Google data.</p>
        <p>Questions: <a href="mailto:support@carlnotes.com">support@carlnotes.com</a></p>
      </main>
    </noscript>
  </body>
</html>
