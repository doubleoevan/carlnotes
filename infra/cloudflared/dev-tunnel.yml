# stable https endpoints for Apple's dev callback and Resend's inbound webhook
# only the two exact host/path pairs reach the local api; all other requests return 404
# the tunnel's credentials stay in ~/.cloudflared/. `cloudflared tunnel create carlnotes-dev` writes them
tunnel: carlnotes-dev
ingress:
  - hostname: apple-dev.carlnotes.com
    path: ^/api/auth/callback/apple$
    service: http://localhost:3000
  - hostname: resend-dev.carlnotes.com
    path: ^/api/webhooks/resend/inbound$
    service: http://localhost:3000
  - service: http_status:404
