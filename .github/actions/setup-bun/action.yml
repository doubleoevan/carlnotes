name: Set up Bun
description: Installs the Bun that .bun-version pins, restores Bun's install cache, and installs the locked dependencies

runs:
  using: composite
  steps:
    # the exact Bun that .bun-version pins, which matches the Bun image the Dockerfile pins
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    # cache Bun's global install cache, keyed by the lockfile
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-
    - run: bun install --frozen-lockfile
      shell: bash
