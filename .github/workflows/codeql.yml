name: CodeQL

# static analysis of the TypeScript on every push to main, every pull request into main, and weekly so new queries run
# over unchanged code. the findings appear under the repository's Security tab as code scanning alerts, and a pull
# request shows its new findings as a check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

# the analysis reads the repo and writes its alerts
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials false keeps the checkout token out of .git/config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # run the extended security queries over the TypeScript with no build step
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"
