name: Smoke

# the whole smoke suite, against the dev database, the real source APIs, object storage, and the litellm,
# temporal, and Redis containers this workflow starts. it writes real rows and spends real model credit, so it
# runs on each push to main or by hand, never on the pr path.
# it needs a DOPPLER_TOKEN repository secret holding a dev-config service token.
on:
  workflow_dispatch:
  push:
    branches: [main]

# one smoke run at a time, since the runs share one dev database
concurrency:
  group: smoke
  cancel-in-progress: false

# the suite only reads the repo
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials false keeps the checkout token out of .git/config
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # the exact Bun the Dockerfile pins, matching the CI gate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # install ffmpeg as the Dockerfile does. the podcast suites encode episode audio and draw covers with it
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # the doppler cli injects the same dev secrets a local smoke run uses
      - uses: dopplerhq/cli-action@v3
      # apply the commit's migrations to the dev database, so the suites run against the schema that the commit expects
      - run: bun run db:migrate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # start the services the suites need: litellm for every model and embedding call, temporal for the
      # attachment workflow, and Redis for the sessions, the rate limits, and the fan-out.
      # they read the same doppler secrets that a developer's compose run reads
      - run: doppler run -- docker compose up -d litellm temporal redis
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # fail with the container logs when they never answer
      - name: Wait for litellm, temporal, and Redis
        run: |
          for attempt in $(seq 1 60); do
            litellm=$(curl -s -o /dev/null -m 5 -w "%{http_code}" http://localhost:4000/health/readiness || echo 000)
            temporal=$(curl -s -o /dev/null -m 5 -w "%{http_code}" http://localhost:8233 || echo 000)
            redis=$(docker compose exec -T redis redis-cli ping 2>/dev/null || echo none)
            if [ "$litellm" = "200" ] && [ "$temporal" = "200" ] && [ "$redis" = "PONG" ]; then
              echo "litellm, temporal, and Redis ready after $attempt attempts"
              exit 0
            fi
            sleep 5
          done
          echo "litellm answered $litellm, temporal answered $temporal, and Redis answered $redis, so the suites that need them cannot run"
          docker compose logs --tail 40 litellm temporal redis
          exit 1
      # the attachment suite needs a worker polling temporal's queues, not just the server behind them.
      # nohup keeps it running across the steps that follow, and its log is printed if it never polls
      - name: Start the temporal worker
        run: nohup doppler run -- env LLM_GUARD_URL= bun worker/temporal.ts > temporal-worker.log 2>&1 &
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # a worker that never polls would otherwise surface as an attachment stuck pending for 90 seconds
      - name: Wait for the temporal worker
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T temporal temporal task-queue describe \
                 --task-queue attachment-processing --namespace default 2>/dev/null \
                 | awk '/^Pollers:/{seen = 1; next} seen && /UNVERSIONED/{found = 1} END{exit !found}'; then
              echo "the temporal worker is polling after $attempt attempts"
              exit 0
            fi
            sleep 5
          done
          echo "the temporal worker never polled attachment-processing, so the attachment suite cannot run"
          cat temporal-worker.log
          exit 1
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # env after doppler run, since doppler injects its own value over anything the step sets
      - run: doppler run -- env LLM_GUARD_URL= bash scripts/smoke-coverage.sh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # the smoke coverage joins the unit coverage on Codecov under its own flag
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          directory: ./coverage/smoke
          flags: smoke
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
