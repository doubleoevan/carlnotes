name: Smoke

# the smoke suites a hosted runner can run: the dev database, most source APIs, and object storage.
# they write real rows, so they run on each push to main or triggered manually, not on the pr path. the
# suites that need litellm or temporal are skipped, since both run in local docker and a runner has neither.
# the full suite is the check a developer runs before pushing.
# it needs a DOPPLER_TOKEN repository secret holding a dev-config service token.
on:
  workflow_dispatch:
  push:
    branches: [main]

# one smoke run at a time, since the runs share one dev database
concurrency:
  group: smoke
  cancel-in-progress: false

# the suite only reads the repo
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials false keeps the checkout token out of .git/config
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # the exact Bun the Dockerfile pins, matching the CI gate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # the doppler cli injects the same dev secrets a local smoke run uses
      - uses: dopplerhq/cli-action@v3
      - run: doppler run -- bash scripts/smoke-coverage.sh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SMOKE_SKIP_DEVELOPER_ONLY: "1"
      # the smoke coverage joins the unit coverage on Codecov under its own flag
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          directory: ./coverage/smoke
          flags: smoke
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
