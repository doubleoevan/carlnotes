# every model names its api key explicitly. left off, litellm derives the variable from the provider prefix and
# looks for FIREWORKS_AI_API_KEY, which nothing sets. FIREWORKS_API_KEY is the one name Doppler and the app use
model_list:
  # plan-model: whole-repo planning, big context
  - model_name: plan-model
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/minimax-m3
      api_key: os.environ/FIREWORKS_API_KEY
    model_info:
      friendly_name: "MiniMax M3"
      supports_function_calling: true   
      supports_vision: true             
      supports_prompt_caching: true
      max_input_tokens: 524288          
      max_output_tokens: 16384

  # apply-model: long-horizon spec implementation
  - model_name: apply-model
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/kimi-k3
      api_key: os.environ/FIREWORKS_API_KEY
      # Fireworks Standard serving path: $3/M input, $0.30/M cached input, $15/M output
      input_cost_per_token: 0.000003
      cache_read_input_token_cost: 0.0000003
      output_cost_per_token: 0.000015
    model_info:
      friendly_name: "Kimi K3"
      supports_function_calling: true
      supports_vision: true
      supports_prompt_caching: true
      max_input_tokens: 1048576
      max_output_tokens: 16384

  # aside-model: cheap side conversations and plan-agent reads
  - model_name: aside-model
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/minimax-m3
      api_key: os.environ/FIREWORKS_API_KEY
    model_info:
      friendly_name: "MiniMax M3 (aside)"
      supports_function_calling: true
      supports_vision: true
      supports_prompt_caching: true
      max_input_tokens: 524288
      max_output_tokens: 8192

  # cheap-model: high-volume app inference (search query generation, first-pass scoring) — the cheap tier
  - model_name: cheap-model
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/minimax-m3
      api_key: os.environ/FIREWORKS_API_KEY
    model_info:
      friendly_name: "MiniMax M3 (app cheap tier)"
      supports_function_calling: true
      supports_prompt_caching: true
      max_input_tokens: 524288
      max_output_tokens: 8192

  # score-model: the review premium tier — re-scores promoted Resources and writes relevance summaries
  - model_name: score-model
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/glm-5p2
      api_key: os.environ/FIREWORKS_API_KEY
    model_info:
      friendly_name: "GLM 5.2"
      supports_function_calling: true
      supports_prompt_caching: true
      max_input_tokens: 1048576
      max_output_tokens: 8192

  # embed-model: the review embedding tier. output_vector_size MUST equal the schema's resources.embedding dimension (1024)
  - model_name: embed-model
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/qwen3-embedding-8b
      api_key: os.environ/FIREWORKS_API_KEY
      dimensions: 1024
    model_info:
      friendly_name: "Qwen3 Embedding 8B"
      mode: embedding
      output_vector_size: 1024

  # chat-model: topic rag chat over findings, accepts image attachments
  - model_name: chat-model
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/kimi-k3
      api_key: os.environ/FIREWORKS_API_KEY
      reasoning_effort: medium
      # Fireworks Standard serving path: $3/M input, $0.30/M cached input, $15/M output
      input_cost_per_token: 0.000003
      cache_read_input_token_cost: 0.0000003
      output_cost_per_token: 0.000015
    model_info:
      friendly_name: "Kimi K3"
      supports_function_calling: true
      supports_vision: true
      supports_prompt_caching: true
      max_input_tokens: 1048576
      max_output_tokens: 32768

# drop provider-unsupported params instead of erroring (Fireworks embeddings reject encoding_format the AI SDK sends).
# no proxy-wide max_budget: spend is capped per virtual key, minted per user at signup and managed in litellm itself.
# the Fireworks prepaid balance is the real ceiling behind those keys
litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL