# coverage reporting only. the CI gate in ci.yml decides pass/fail, Codecov never blocks a merge
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: true