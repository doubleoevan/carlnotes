# test coverage settings. coverage itself stays opt-in: the preflight gate passes --coverage per invocation
[test]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# test files are not measured
coverageSkipTestFiles = true
# generated migration SQL, smoke checks, the eval and tooling scripts, and a test's fake ui bundle are not measured
coveragePathIgnorePatterns = ["db/migrations/**", "**/*.smoke.ts", "evals/**", "scripts/**", "**/carl-bundle-*/**"]
